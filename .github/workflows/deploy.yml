name: CLOUD RUN BUILD AND DEPLOY
on:
  push:
    branches:
    - main

env:
  GCP_PROJECT_ID: 'tamgam-499914'               # Put your text-based Project ID here (e.g., my-sample-project)
  GAR_LOCATION: 'us-central1'                        # The physical data center region for your container storage
  CR_REGION: 'us-central1'                           # The physical data center region where your web app lives
  SERVICE_NAME: 'calc-cloud-run-deploy'                # The name your application will have in Cloud Run
  REPOSITORY_NAME: 'tamgam'                  # The storage bucket name inside Artifact Registry


permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy code on Github server
        uses: actions/checkout@v4

      - name: Google cloud login
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/571444843501/locations/global/workloadIdentityPools/calc-webinar/providers/github-provider'
          service_account: '571444843501-compute@://gserviceaccount.com'

      - name: Login to Artifact Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key_base64
          password: ${{ steps.auth.outputs.auth_token }}

      - name: Build and Push container
        uses: docker/build-push-action@v6
        with:
          contect: .
          push: true
          tags: | 
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.CR_REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
